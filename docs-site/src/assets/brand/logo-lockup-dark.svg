<?xml version="1.0" encoding="UTF-8"?>
<!-- OMem horizontal lockup — DARK (paper on ink). For Starlight dark theme. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 120" role="img" aria-label="OMem — the office your AI remembers.">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&amp;display=swap');
  ]]></style>
  <g transform="translate(0,15) scale(0.9)">
    <rect x="4" y="4" width="92" height="92" rx="3" fill="none" stroke="#F5F1E8" stroke-width="1.5"/>
    <rect x="8.5" y="8.5" width="83" height="83" rx="2" fill="none" stroke="#F5F1E8" stroke-width="0.7"/>
    <text x="50" y="22" font-family="'Cormorant Garamond', 'EB Garamond', Garamond, serif" font-weight="500" font-size="6.5" fill="#F5F1E8" text-anchor="middle" letter-spacing="2">EX OFFICIO</text>
    <line x1="42" y1="27" x2="58" y2="27" stroke="#F5F1E8" stroke-width="0.4"/>
