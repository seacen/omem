  <text x="115" y="56" font-family="'EB Garamond', Garamond, serif" font-weight="500" font-size="44" fill="#F5F1E8" letter-spacing="-1.5">OMem</text>
  <line x1="115" y1="70" x2="370" y2="70" stroke="#F5F1E8" stroke-width="0.5"/>
  <text x="115" y="92" font-family="'Cormorant Garamond', 'EB Garamond', Garamond, serif" font-style="italic" font-weight="500" font-size="18" fill="#F5F1E8" fill-opacity="0.9" letter-spacing="0.3">The office your AI remembers.</text>
