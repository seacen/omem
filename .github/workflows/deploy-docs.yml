# Build the Astro docs site (docs-site/) and publish it to GitHub Pages.
# The site is served at https://seacen.github.io/omem/ — astro.config.mjs sets
# `base: '/omem'` to match. Triggers on pushes to main that touch docs-site/,
# and is manually runnable from the Actions tab.
name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Permissions the deploy-pages action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deployment at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      # GitHub Pages serves under /omem; tell Astro to build for that sub-path.
      # (Local dev + EdgeOne use the root-path default, so they set nothing.)
      - run: npx astro build
        env:
          DOCS_BASE: /omem
          DOCS_SITE: https://seacen.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
